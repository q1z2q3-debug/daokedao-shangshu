name: build-apk

on:
  workflow_dispatch:
  push:
    paths:
      - 'dist/apk-shangshu/**'
      - '.github/workflows/apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build debug APK
        run: |
          cd dist/apk-shangshu
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename artifact
        run: cp dist/apk-shangshu/app/build/outputs/apk/debug/app-debug.apk 道可道之尚书-v0.3.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: daokedao-shangshu-apk
          path: 道可道之尚书-v0.3.0.apk
