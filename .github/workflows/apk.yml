name: build-apk

on:
  workflow_dispatch:
  push:
    paths:
      - 'dist/apk-shangshu/**'
      - '.github/workflows/apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (manual)
        run: |
          set -e
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        run: |
          cd dist/apk-shangshu
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package artifact
        run: cp dist/apk-shangshu/app/build/outputs/apk/debug/app-debug.apk "道可道之尚书-v0.3.9.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: daokedao-shangshu-apk
          path: 道可道之尚书-v0.3.9.apk
