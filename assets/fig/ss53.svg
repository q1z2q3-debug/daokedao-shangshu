<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 282" role="img">
<title>教者三准：身、中、艰</title>
<desc>《君牙》诰辞不论职掌细节，只论教者一身：己正、立准、认难。</desc>
<rect x="0" y="0" width="760" height="282" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">教者三准：身、中、艰</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<rect x="32" y="92" width="218" height="134" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="32" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="46" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">身</text>
<text x="48" y="150" font-size="13" fill="#25211D" text-anchor="start">尔身克正，罔敢弗正</text><text x="48" y="175" font-size="13" fill="#25211D" text-anchor="start">教者之身即教材</text>
<rect x="270" y="92" width="218" height="134" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="270" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="284" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">中</text>
<text x="286" y="150" font-size="13" fill="#25211D" text-anchor="start">民心罔中，惟尔之中</text><text x="286" y="175" font-size="13" fill="#25211D" text-anchor="start">无共识时先立一准</text>
<rect x="508" y="92" width="218" height="134" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="508" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="522" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">艰</text>
<text x="524" y="150" font-size="13" fill="#25211D" text-anchor="start">思其艰，以图其易</text><text x="524" y="175" font-size="13" fill="#25211D" text-anchor="start">不认难者，所求皆空</text>
<text x="32" y="256" font-size="12" fill="#7C6D5C" text-anchor="start">三准皆指教者，不指民；由内而外：身→中→艰。</text>
</svg>
