<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" role="img">
<title>惭心转日新</title>
<desc>不安被接住，转成自约的路</desc>
<rect x="0" y="0" width="760" height="256" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">惭心转日新</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<rect x="32" y="100" width="214" height="96" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="139" y="142" font-size="16" fill="#994433" text-anchor="middle">惭于既往</text>
<text x="139" y="172" font-size="12" fill="#7C6D5C" text-anchor="middle">录汤之惭</text>
<line x1="250" y1="148" x2="268" y2="148" stroke="#7C6D5C" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="272" y="100" width="214" height="96" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="379" y="142" font-size="16" fill="#994433" text-anchor="middle">举证民戴</text>
<text x="379" y="172" font-size="12" fill="#7C6D5C" text-anchor="middle">东征西怨</text>
<line x1="490" y1="148" x2="508" y2="148" stroke="#7C6D5C" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="512" y="100" width="214" height="96" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="619" y="142" font-size="16" fill="#994433" text-anchor="middle">日新今后</text>
<text x="619" y="172" font-size="12" fill="#7C6D5C" text-anchor="middle">不滞于旧</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C6D5C"/></marker></defs>
<text x="32" y="230" font-size="12" fill="#7C6D5C" text-anchor="start">看图看箭头：由过去转向今后</text>
</svg>
