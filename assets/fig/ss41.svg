<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 484" role="img">
<title>一诰两事：宅与政</title>
<desc>三端属宅、两端属政；地与政同收，才成周之基。</desc>
<rect x="0" y="0" width="760" height="484" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">一诰两事：宅与政</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<circle cx="380" cy="250" r="138" fill="none" stroke="#DCD5C8" stroke-width="1" stroke-dasharray="4 5"/>
<circle cx="380" cy="112" r="38" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="380" y="117" font-size="13" fill="#994433" text-anchor="middle">卜涧瀍</text>
<text x="380" y="174" font-size="11" fill="#7C6D5C" text-anchor="middle">惟洛食</text>
<circle cx="511" cy="207" r="38" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="511" y="212" font-size="13" fill="#25211D" text-anchor="middle">献图卜</text>
<text x="511" y="269" font-size="11" fill="#7C6D5C" text-anchor="middle">伻来以图</text>
<circle cx="461" cy="361" r="38" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="461" y="366" font-size="13" fill="#994433" text-anchor="middle">肇殷礼</text>
<text x="461" y="423" font-size="11" fill="#7C6D5C" text-anchor="middle">咸秩无文</text>
<circle cx="298" cy="361" r="38" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="298" y="366" font-size="13" fill="#25211D" text-anchor="middle">孺子其朋</text>
<text x="298" y="423" font-size="11" fill="#7C6D5C" text-anchor="middle">火始焰焰</text>
<circle cx="248" cy="207" r="38" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="248" y="212" font-size="13" fill="#994433" text-anchor="middle">命公后</text>
<text x="248" y="269" font-size="11" fill="#7C6D5C" text-anchor="middle">乱为四辅</text>
<text x="380" y="256" font-size="15" fill="#25211D" text-anchor="middle">宅洛·复辟</text>
<text x="32" y="458" font-size="12" fill="#7C6D5C" text-anchor="start">朕复子明辟　·　惟周公诞保文武受命，惟七年</text>
</svg>
