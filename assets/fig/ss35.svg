<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" role="img">
<title>大诰艰难说服四步</title>
<desc>先认难处，再陈依据，设喻明责，共断东征</desc>
<rect x="0" y="0" width="760" height="256" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">大诰艰难说服四步</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<rect x="32" y="100" width="154" height="96" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="109" y="142" font-size="16" fill="#994433" text-anchor="middle">天降艰威</text>
<text x="109" y="172" font-size="12" fill="#7C6D5C" text-anchor="middle">嗣服若涉渊水</text>
<line x1="190" y1="148" x2="208" y2="148" stroke="#7C6D5C" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="212" y="100" width="154" height="96" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="289" y="142" font-size="16" fill="#994433" text-anchor="middle">卜并吉</text>
<text x="289" y="172" font-size="12" fill="#7C6D5C" text-anchor="middle">龟卜史迹民助</text>
<line x1="370" y1="148" x2="388" y2="148" stroke="#7C6D5C" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="392" y="100" width="154" height="96" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="469" y="142" font-size="16" fill="#994433" text-anchor="middle">设喻解疑</text>
<text x="469" y="172" font-size="12" fill="#7C6D5C" text-anchor="middle">作室菑播弗救</text>
<line x1="550" y1="148" x2="568" y2="148" stroke="#7C6D5C" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="572" y="100" width="154" height="96" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="649" y="142" font-size="16" fill="#994433" text-anchor="middle">决计东征</text>
<text x="649" y="172" font-size="12" fill="#7C6D5C" text-anchor="middle">天命不僭</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C6D5C"/></marker></defs>
<text x="32" y="230" font-size="12" fill="#7C6D5C" text-anchor="start">看图看次序：由认难处到共决断，卜兆只是参稽</text>
</svg>
