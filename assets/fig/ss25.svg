<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" role="img">
<title>三证：事、因、验</title>
<desc>先报事，再定因，末以民与功为验；三层一落，恃命就无处藏。</desc>
<rect x="0" y="0" width="760" height="332" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">三证：事、因、验</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<rect x="32" y="92" width="218" height="184" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="32" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="46" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">事</text>
<text x="48" y="150" font-size="13" fill="#25211D" text-anchor="start">黎既戡</text><text x="48" y="175" font-size="13" fill="#25211D" text-anchor="start">天讫殷命</text><text x="48" y="200" font-size="13" fill="#25211D" text-anchor="start">元龟罔敢知吉</text><text x="48" y="225" font-size="13" fill="#25211D" text-anchor="start">不有康食</text>
<rect x="270" y="92" width="218" height="184" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="270" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="284" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">因</text>
<text x="286" y="150" font-size="13" fill="#25211D" text-anchor="start">非先王不相我</text><text x="286" y="175" font-size="13" fill="#25211D" text-anchor="start">淫戏用自绝</text><text x="286" y="200" font-size="13" fill="#25211D" text-anchor="start">不虞天性</text><text x="286" y="225" font-size="13" fill="#25211D" text-anchor="start">不迪率典</text>
<rect x="508" y="92" width="218" height="184" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="508" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="522" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">验</text>
<text x="524" y="150" font-size="13" fill="#25211D" text-anchor="start">民罔弗欲丧</text><text x="524" y="175" font-size="13" fill="#25211D" text-anchor="start">天曷不降威</text><text x="524" y="200" font-size="13" fill="#25211D" text-anchor="start">大命不挚</text><text x="524" y="225" font-size="13" fill="#25211D" text-anchor="start">指乃功为证</text>
<text x="32" y="306" font-size="12" fill="#7C6D5C" text-anchor="start">乃罪多，参在上，乃能责命于天</text>
</svg>
