<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" role="img">
<title>礼的空间：四席四器</title>
<desc>《顾命》所记路寝之陈设：四席四向，席、纯、器、几各随其位，礼以物与位立，不以辞立。</desc>
<rect x="0" y="0" width="760" height="334" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">礼的空间：四席四器</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<text x="203" y="84" font-size="12.5" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" text-anchor="middle">席</text>
<line x1="128" y1="96" x2="128" y2="280" stroke="#DCD5C8"/>
<text x="353" y="84" font-size="12.5" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" text-anchor="middle">纯</text>
<line x1="278" y1="96" x2="278" y2="280" stroke="#DCD5C8"/>
<text x="503" y="84" font-size="12.5" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" text-anchor="middle">器</text>
<line x1="428" y1="96" x2="428" y2="280" stroke="#DCD5C8"/>
<text x="653" y="84" font-size="12.5" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" text-anchor="middle">几</text>
<line x1="578" y1="96" x2="578" y2="280" stroke="#DCD5C8"/>
<line x1="32" y1="96" x2="728" y2="96" stroke="#DCD5C8"/>
<line x1="32" y1="142" x2="728" y2="142" stroke="#DCD5C8"/>
<text x="38" y="123" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">牖间南向</text>
<text x="203" y="123" font-size="12" fill="#25211D" text-anchor="middle">篾席</text>
<text x="353" y="123" font-size="12" fill="#25211D" text-anchor="middle">黼纯</text>
<text x="503" y="123" font-size="12" fill="#25211D" text-anchor="middle">华玉</text>
<text x="653" y="123" font-size="12" fill="#25211D" text-anchor="middle">仍几</text>
<line x1="32" y1="188" x2="728" y2="188" stroke="#DCD5C8"/>
<text x="38" y="169" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">西序东向</text>
<text x="203" y="169" font-size="12" fill="#25211D" text-anchor="middle">底席</text>
<text x="353" y="169" font-size="12" fill="#25211D" text-anchor="middle">缀纯</text>
<text x="503" y="169" font-size="12" fill="#25211D" text-anchor="middle">文贝</text>
<text x="653" y="169" font-size="12" fill="#25211D" text-anchor="middle">仍几</text>
<line x1="32" y1="234" x2="728" y2="234" stroke="#DCD5C8"/>
<text x="38" y="215" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">东序西向</text>
<text x="203" y="215" font-size="12" fill="#25211D" text-anchor="middle">丰席</text>
<text x="353" y="215" font-size="12" fill="#25211D" text-anchor="middle">画纯</text>
<text x="503" y="215" font-size="12" fill="#25211D" text-anchor="middle">雕玉</text>
<text x="653" y="215" font-size="12" fill="#25211D" text-anchor="middle">仍几</text>
<line x1="32" y1="280" x2="728" y2="280" stroke="#DCD5C8"/>
<text x="38" y="261" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">西夹南向</text>
<text x="203" y="261" font-size="12" fill="#25211D" text-anchor="middle">笋席</text>
<text x="353" y="261" font-size="12" fill="#25211D" text-anchor="middle">玄纷纯</text>
<text x="503" y="261" font-size="12" fill="#25211D" text-anchor="middle">漆</text>
<text x="653" y="261" font-size="12" fill="#25211D" text-anchor="middle">仍几</text>
<text x="32" y="308" font-size="12" fill="#7C6D5C" text-anchor="start">四席异向，四器异等；位定则礼定，礼定则辞可省。</text>
</svg>
