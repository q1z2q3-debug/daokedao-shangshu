<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" role="img">
<title>蔡仲之命：改过封侯四步</title>
<desc>群叔受罚、仲庸祗德、命侯东土、守中安民：前过先明，转折在自身之德。</desc>
<rect x="0" y="0" width="760" height="256" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">蔡仲之命：改过封侯四步</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<rect x="32" y="100" width="154" height="96" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="109" y="142" font-size="16" fill="#994433" text-anchor="middle">群叔受罚</text>
<text x="109" y="172" font-size="12" fill="#7C6D5C" text-anchor="middle">三叔流言，管诛蔡囚霍降</text>
<line x1="190" y1="148" x2="208" y2="148" stroke="#7C6D5C" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="212" y="100" width="154" height="96" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="289" y="142" font-size="16" fill="#994433" text-anchor="middle">仲庸祗德</text>
<text x="289" y="172" font-size="12" fill="#7C6D5C" text-anchor="middle">率德改行，克慎厥猷</text>
<line x1="370" y1="148" x2="388" y2="148" stroke="#7C6D5C" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="392" y="100" width="154" height="96" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="469" y="142" font-size="16" fill="#994433" text-anchor="middle">命侯东土</text>
<text x="469" y="172" font-size="12" fill="#7C6D5C" text-anchor="middle">盖愆迈迹，垂宪乃后</text>
<line x1="550" y1="148" x2="568" y2="148" stroke="#7C6D5C" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="572" y="100" width="154" height="96" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="649" y="142" font-size="16" fill="#994433" text-anchor="middle">守中安民</text>
<text x="649" y="172" font-size="12" fill="#7C6D5C" text-anchor="middle">睦邻蕃室，康济小民</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C6D5C"/></marker></defs>
<text x="32" y="230" font-size="12" fill="#7C6D5C" text-anchor="start">不乱旧章、罔以侧言改度，同在末步；父罪不被抹除，德也不替前人卸过。</text>
</svg>
