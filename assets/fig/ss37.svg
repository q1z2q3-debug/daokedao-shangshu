<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 394" role="img">
<title>康诰的法理三层</title>
<desc>天命在上，裁断在中，民土在下，保民一线贯穿</desc>
<rect x="0" y="0" width="760" height="394" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">康诰的法理三层</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<rect x="32" y="92" width="696" height="74" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="50" y="124" font-size="15" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">天（识）</text>
<text x="50" y="148" font-size="12" fill="#25211D" text-anchor="start">天命与天威：天乃大命文王，天畏棐忱</text>
<rect x="42" y="178" width="676" height="74" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="60" y="210" font-size="15" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">人（受想行）</text>
<text x="60" y="234" font-size="12" fill="#25211D" text-anchor="start">明德立身，陈臬断狱；慎罚有据有度</text>
<rect x="52" y="264" width="656" height="74" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="70" y="296" font-size="15" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">地（色）</text>
<text x="70" y="320" font-size="12" fill="#25211D" text-anchor="start">殷遗之民，东土邦国；保民康乂，作新民</text>
<text x="32" y="368" font-size="12" fill="#7C6D5C" text-anchor="start">看图看三层各归其位：德立身，刑收口，民为验</text>
</svg>
