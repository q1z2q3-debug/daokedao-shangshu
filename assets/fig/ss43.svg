<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" role="img">
<title>无逸四王敬慎对照</title>
<desc>中宗高宗祖甲文王四行，分所由入、所敬之迹、享国年三列；逸乐后王短折为对照</desc>
<rect x="0" y="0" width="760" height="334" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">无逸四王敬慎对照</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<text x="228" y="84" font-size="12.5" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" text-anchor="middle">所由入</text>
<line x1="128" y1="96" x2="128" y2="280" stroke="#DCD5C8"/>
<text x="428" y="84" font-size="12.5" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" text-anchor="middle">所敬之迹</text>
<line x1="328" y1="96" x2="328" y2="280" stroke="#DCD5C8"/>
<text x="628" y="84" font-size="12.5" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" text-anchor="middle">享国</text>
<line x1="528" y1="96" x2="528" y2="280" stroke="#DCD5C8"/>
<line x1="32" y1="96" x2="728" y2="96" stroke="#DCD5C8"/>
<line x1="32" y1="142" x2="728" y2="142" stroke="#DCD5C8"/>
<text x="38" y="123" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">中宗</text>
<text x="228" y="123" font-size="12" fill="#25211D" text-anchor="middle">闻于殷道</text>
<text x="428" y="123" font-size="12" fill="#25211D" text-anchor="middle">严恭寅畏</text>
<text x="628" y="123" font-size="12" fill="#25211D" text-anchor="middle">七十五年</text>
<line x1="32" y1="188" x2="728" y2="188" stroke="#DCD5C8"/>
<text x="38" y="169" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">高宗</text>
<text x="228" y="169" font-size="12" fill="#25211D" text-anchor="middle">旧劳于外</text>
<text x="428" y="169" font-size="12" fill="#25211D" text-anchor="middle">言乃雍，嘉靖殷邦</text>
<text x="628" y="169" font-size="12" fill="#25211D" text-anchor="middle">五十九年</text>
<line x1="32" y1="234" x2="728" y2="234" stroke="#DCD5C8"/>
<text x="38" y="215" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">祖甲</text>
<text x="228" y="215" font-size="12" fill="#25211D" text-anchor="middle">旧为小人</text>
<text x="428" y="215" font-size="12" fill="#25211D" text-anchor="middle">保惠庶民，不侮鳏寡</text>
<text x="628" y="215" font-size="12" fill="#25211D" text-anchor="middle">三十三年</text>
<line x1="32" y1="280" x2="728" y2="280" stroke="#DCD5C8"/>
<text x="38" y="261" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">周文王</text>
<text x="228" y="261" font-size="12" fill="#25211D" text-anchor="middle">卑服田功</text>
<text x="428" y="261" font-size="12" fill="#25211D" text-anchor="middle">咸和万民，惠鲜鳏寡</text>
<text x="628" y="261" font-size="12" fill="#25211D" text-anchor="middle">五十年</text>
<text x="32" y="308" font-size="12" fill="#7C6D5C" text-anchor="start">看图看什么：享国长短背后，是知艰难还是耽逸乐</text>
</svg>
