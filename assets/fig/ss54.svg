<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 343" role="img">
<title>近与远：近臣之择与君德之成</title>
<desc>《冏命》命太仆正：君德不由君自造，由左右日成。</desc>
<rect x="0" y="0" width="760" height="343" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">近与远：近臣之择与君德之成</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<rect x="32" y="84" width="325" height="205" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="403" y="84" width="325" height="205" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="32" y="84" width="325" height="30" fill="#DCD5C8"/>
<rect x="403" y="84" width="325" height="30" fill="#DCD5C8"/>
<text x="46" y="105" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="3">近臣之择</text>
<text x="417" y="105" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="3">君德之成</text>
<text x="50" y="150" font-size="13" fill="#25211D" text-anchor="start">慎简乃僚：择其吉士</text><text x="50" y="176" font-size="13" fill="#25211D" text-anchor="start">无以巧言令色、便辟侧媚</text><text x="50" y="202" font-size="13" fill="#25211D" text-anchor="start">无昵憸人，充耳目之官</text><text x="50" y="228" font-size="13" fill="#25211D" text-anchor="start">非人其吉，惟货其吉——两戒</text>
<text x="421" y="150" font-size="13" fill="#25211D" text-anchor="start">仆臣正 → 厥后克正</text><text x="421" y="176" font-size="13" fill="#25211D" text-anchor="start">仆臣谀 → 厥后自圣</text><text x="421" y="202" font-size="13" fill="#25211D" text-anchor="start">绳愆纠谬，格其非心</text><text x="421" y="228" font-size="13" fill="#25211D" text-anchor="start">永弼乃后于彝宪</text>
<line x1="367" y1="186" x2="391" y2="186" stroke="#7C6D5C" stroke-width="1" marker-end="url(#ar)"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C6D5C"/></marker></defs>
<text x="32" y="317" font-size="12" fill="#7C6D5C" text-anchor="start">箭头由臣及君：正君者以常法，不以私意。</text>
</svg>
