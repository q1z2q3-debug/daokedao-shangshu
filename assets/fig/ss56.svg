<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 343" role="img">
<title>赐与报：王之所予与侯之所任</title>
<desc>《文侯之命》平王赐晋文侯弓矢秬鬯：予者为物，任者为事；物有尽，事无尽。</desc>
<rect x="0" y="0" width="760" height="343" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">赐与报：王之所予与侯之所任</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<rect x="32" y="84" width="325" height="205" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="403" y="84" width="325" height="205" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="32" y="84" width="325" height="30" fill="#DCD5C8"/>
<rect x="403" y="84" width="325" height="30" fill="#DCD5C8"/>
<text x="46" y="105" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="3">王之所予</text>
<text x="417" y="105" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="3">侯之所任</text>
<text x="50" y="150" font-size="13" fill="#25211D" text-anchor="start">秬鬯一卣：祭庙之赐</text><text x="50" y="176" font-size="13" fill="#25211D" text-anchor="start">彤弓一，彤矢百</text><text x="50" y="202" font-size="13" fill="#25211D" text-anchor="start">卢弓一，卢矢百</text><text x="50" y="228" font-size="13" fill="#25211D" text-anchor="start">马四匹</text>
<text x="421" y="150" font-size="13" fill="#25211D" text-anchor="start">克绍乃显祖，肇刑文、武</text><text x="421" y="176" font-size="13" fill="#25211D" text-anchor="start">扞我于艰：全篇分量所在</text><text x="421" y="202" font-size="13" fill="#25211D" text-anchor="start">柔远能迩：怀远而和近</text><text x="421" y="228" font-size="13" fill="#25211D" text-anchor="start">惠康小民，用无荒宁</text>
<line x1="367" y1="186" x2="391" y2="186" stroke="#7C6D5C" stroke-width="1" marker-end="url(#ar)"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C6D5C"/></marker></defs>
<text x="32" y="317" font-size="12" fill="#7C6D5C" text-anchor="start">左皆物，右皆事；赐物之价，在「扞艰」二字。</text>
</svg>
