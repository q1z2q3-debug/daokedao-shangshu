<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img">
<title>学之四层</title>
<desc>自入门至见效，层层相叠；见效处反而无声。</desc>
<rect x="0" y="0" width="760" height="480" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">学之四层</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<rect x="32" y="92" width="696" height="74" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="50" y="124" font-size="15" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">逊志</text>
<text x="50" y="148" font-size="12" fill="#25211D" text-anchor="start">卑逊其志，先肯受</text>
<rect x="42" y="178" width="676" height="74" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="60" y="210" font-size="15" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">时敏</text>
<text x="60" y="234" font-size="12" fill="#25211D" text-anchor="start">及时而敏，所修乃来</text>
<rect x="52" y="264" width="656" height="74" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="70" y="296" font-size="15" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">斆学半</text>
<text x="70" y="320" font-size="12" fill="#25211D" text-anchor="start">教以验学，讲不清处即缺口</text>
<rect x="62" y="350" width="636" height="74" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="80" y="382" font-size="15" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">德修罔觉</text>
<text x="80" y="406" font-size="12" fill="#25211D" text-anchor="start">终始典于学，日积而不自知</text>
<text x="32" y="454" font-size="12" fill="#7C6D5C" text-anchor="start">事不师古，以克永世，匪说攸闻</text>
</svg>
