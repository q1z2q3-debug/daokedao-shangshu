<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" role="img">
<title>三代用人：位与人，心与法</title>
<desc>兴系于得人，亡系于失人；得位之后，还须知心、知止。</desc>
<rect x="0" y="0" width="760" height="288" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">三代用人：位与人，心与法</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<text x="228" y="84" font-size="12.5" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" text-anchor="middle">得其人</text>
<line x1="128" y1="96" x2="128" y2="234" stroke="#DCD5C8"/>
<text x="428" y="84" font-size="12.5" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" text-anchor="middle">失其人</text>
<line x1="328" y1="96" x2="328" y2="234" stroke="#DCD5C8"/>
<text x="628" y="84" font-size="12.5" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" text-anchor="middle">所立之政</text>
<line x1="528" y1="96" x2="528" y2="234" stroke="#DCD5C8"/>
<line x1="32" y1="96" x2="728" y2="96" stroke="#DCD5C8"/>
<line x1="32" y1="142" x2="728" y2="142" stroke="#DCD5C8"/>
<text x="38" y="123" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">夏</text>
<text x="228" y="123" font-size="12" fill="#25211D" text-anchor="middle">吁俊·九德之行</text>
<text x="428" y="123" font-size="12" fill="#25211D" text-anchor="middle">桀：暴德罔后</text>
<text x="628" y="123" font-size="12" fill="#25211D" text-anchor="middle">有室大竞</text>
<line x1="32" y1="188" x2="728" y2="188" stroke="#DCD5C8"/>
<text x="38" y="169" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">殷</text>
<text x="228" y="169" font-size="12" fill="#25211D" text-anchor="middle">成汤：三宅三俊</text>
<text x="428" y="169" font-size="12" fill="#25211D" text-anchor="middle">纣：羞刑暴德</text>
<text x="628" y="169" font-size="12" fill="#25211D" text-anchor="middle">用协于邑</text>
<line x1="32" y1="234" x2="728" y2="234" stroke="#DCD5C8"/>
<text x="38" y="215" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">周</text>
<text x="228" y="215" font-size="12" fill="#25211D" text-anchor="middle">文武：知宅心俊心</text>
<text x="428" y="215" font-size="12" fill="#25211D" text-anchor="middle">（无失可记）</text>
<text x="628" y="215" font-size="12" fill="#25211D" text-anchor="middle">罔敢知·立民长伯</text>
<text x="32" y="262" font-size="12" fill="#7C6D5C" text-anchor="start">任人、准夫、牧，作三事　·　时则勿有间之，自一话一言</text>
</svg>
