<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 343" role="img">
<title>多士敬与不敬两途</title>
<desc>左栏克敬，右栏不克敬；分野只在能否敬，标准在德不在故邦</desc>
<rect x="0" y="0" width="760" height="343" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">多士敬与不敬两途</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<rect x="32" y="84" width="325" height="205" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="403" y="84" width="325" height="205" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="32" y="84" width="325" height="30" fill="#DCD5C8"/>
<rect x="403" y="84" width="325" height="30" fill="#DCD5C8"/>
<text x="46" y="105" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="3">克敬</text>
<text x="417" y="105" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="3">不克敬</text>
<text x="50" y="150" font-size="13" fill="#25211D" text-anchor="start">天惟畀矜尔</text><text x="50" y="176" font-size="13" fill="#25211D" text-anchor="start">尚有尔土，宁干止</text><text x="50" y="202" font-size="13" fill="#25211D" text-anchor="start">有干有年于兹洛</text><text x="50" y="228" font-size="13" fill="#25211D" text-anchor="start">小子乃兴，从尔迁</text>
<text x="421" y="150" font-size="13" fill="#25211D" text-anchor="start">不啻不有尔土</text><text x="421" y="176" font-size="13" fill="#25211D" text-anchor="start">致天之罚于尔躬</text><text x="421" y="202" font-size="13" fill="#25211D" text-anchor="start">罔顾天显民祗之戒</text><text x="421" y="228" font-size="13" fill="#25211D" text-anchor="start">失德者丧，有辞于罚</text>
<line x1="367" y1="186" x2="391" y2="186" stroke="#7C6D5C" stroke-width="1" marker-end="url(#ar)"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C6D5C"/></marker></defs>
<text x="32" y="317" font-size="12" fill="#7C6D5C" text-anchor="start">看图看什么：同一批人，两条出路，分野在能不能敬</text>
</svg>
