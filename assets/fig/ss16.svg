<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" role="img">
<title>三处凭据：都不预定</title>
<desc>天、民、鬼神皆不预定所归，凭据只在当下之德。</desc>
<rect x="0" y="0" width="760" height="332" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">三处凭据：都不预定</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<rect x="32" y="92" width="218" height="184" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="32" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="46" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">天</text>
<text x="48" y="150" font-size="13" fill="#25211D" text-anchor="start">惟天无亲</text><text x="48" y="175" font-size="13" fill="#25211D" text-anchor="start">克敬惟亲</text><text x="48" y="200" font-size="13" fill="#25211D" text-anchor="start">不敬则弃</text><text x="48" y="225" font-size="13" fill="#25211D" text-anchor="start">凭据：敬</text>
<rect x="270" y="92" width="218" height="184" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="270" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="284" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">民</text>
<text x="286" y="150" font-size="13" fill="#25211D" text-anchor="start">民罔常怀</text><text x="286" y="175" font-size="13" fill="#25211D" text-anchor="start">怀于有仁</text><text x="286" y="200" font-size="13" fill="#25211D" text-anchor="start">不仁则去</text><text x="286" y="225" font-size="13" fill="#25211D" text-anchor="start">凭据：仁</text>
<rect x="508" y="92" width="218" height="184" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="508" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="522" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">鬼神</text>
<text x="524" y="150" font-size="13" fill="#25211D" text-anchor="start">神无常享</text><text x="524" y="175" font-size="13" fill="#25211D" text-anchor="start">享于克诚</text><text x="524" y="200" font-size="13" fill="#25211D" text-anchor="start">不诚则废</text><text x="524" y="225" font-size="13" fill="#25211D" text-anchor="start">凭据：诚</text>
<text x="32" y="306" font-size="12" fill="#7C6D5C" text-anchor="start">与治同道，罔不兴　·　终始慎厥与，惟明明后</text>
</svg>
