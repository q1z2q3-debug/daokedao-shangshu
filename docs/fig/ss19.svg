<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 484" role="img">
<title>盘庚中的「同心」</title>
<desc>对庶民讲的不再是祖德与利害的推演，而是「我们是一体」这件事本身</desc>
<rect x="0" y="0" width="760" height="484" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">盘庚中的「同心」</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<circle cx="380" cy="250" r="138" fill="none" stroke="#DCD5C8" stroke-width="1" stroke-dasharray="4 5"/>
<circle cx="380" cy="112" r="38" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="380" y="117" font-size="13" fill="#994433" text-anchor="middle">迁以避害</text>
<circle cx="511" cy="207" r="38" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="511" y="212" font-size="13" fill="#25211D" text-anchor="middle">浮言惑众</text>
<circle cx="461" cy="361" r="38" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="461" y="366" font-size="13" fill="#994433" text-anchor="middle">祖考在上</text>
<circle cx="298" cy="361" r="38" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="298" y="366" font-size="13" fill="#25211D" text-anchor="middle">老幼相携</text>
<circle cx="248" cy="207" r="38" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="248" y="212" font-size="13" fill="#994433" text-anchor="middle">罚及尔身</text>
<text x="380" y="256" font-size="15" fill="#25211D" text-anchor="middle">同心</text>
<text x="32" y="458" font-size="12" fill="#7C6D5C" text-anchor="start">环上五项，任何一项松动，「同心」就只剩下威吓</text>
</svg>
