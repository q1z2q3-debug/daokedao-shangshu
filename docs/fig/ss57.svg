<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 307" role="img">
<title>军令三层：器、畜、粮</title>
<desc>《费誓》一百八十三字，大半在讲物：胜负先决于物备，不决于辞气。</desc>
<rect x="0" y="0" width="760" height="307" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">军令三层：器、畜、粮</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<rect x="32" y="92" width="218" height="159" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="32" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="46" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">一 备器</text>
<text x="48" y="150" font-size="13" fill="#25211D" text-anchor="start">善敹甲胄，敿乃干</text><text x="48" y="175" font-size="13" fill="#25211D" text-anchor="start">备弓矢，锻戈矛</text><text x="48" y="200" font-size="13" fill="#25211D" text-anchor="start">砺锋刃，无敢不善</text>
<rect x="270" y="92" width="218" height="159" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="270" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="284" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">二 护畜</text>
<text x="286" y="150" font-size="13" fill="#25211D" text-anchor="start">淫舍牿牛马</text><text x="286" y="175" font-size="13" fill="#25211D" text-anchor="start">杜乃擭，敜乃穽</text><text x="286" y="200" font-size="13" fill="#25211D" text-anchor="start">伤牿者有常刑</text>
<rect x="508" y="92" width="218" height="159" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="508" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="522" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">三 峙粮</text>
<text x="524" y="150" font-size="13" fill="#25211D" text-anchor="start">糗粮不逮则大刑</text><text x="524" y="175" font-size="13" fill="#25211D" text-anchor="start">桢干不供则无余刑</text><text x="524" y="200" font-size="13" fill="#25211D" text-anchor="start">刍茭不多则大刑</text>
<text x="32" y="281" font-size="12" fill="#7C6D5C" text-anchor="start">甲戌之期在三层之后：先备物，后立期，刑在其末。</text>
</svg>
