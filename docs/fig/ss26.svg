<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 357" role="img">
<title>一病、一问、一断</title>
<desc>病看得清，问才问得准；问得准，断才断得分。</desc>
<rect x="0" y="0" width="760" height="357" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">一病、一问、一断</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<rect x="32" y="92" width="218" height="209" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="32" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="46" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">殷之病</text>
<text x="48" y="150" font-size="13" fill="#25211D" text-anchor="start">沈酗于酒</text><text x="48" y="175" font-size="13" fill="#25211D" text-anchor="start">草窃奸宄</text><text x="48" y="200" font-size="13" fill="#25211D" text-anchor="start">有罪罔恒获</text><text x="48" y="225" font-size="13" fill="#25211D" text-anchor="start">小民相仇</text><text x="48" y="250" font-size="13" fill="#25211D" text-anchor="start">多瘠罔诏</text>
<rect x="270" y="92" width="218" height="209" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="270" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="284" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">微子之问</text>
<text x="286" y="150" font-size="13" fill="#25211D" text-anchor="start">我其出而去</text><text x="286" y="175" font-size="13" fill="#25211D" text-anchor="start">抑逊于荒</text><text x="286" y="200" font-size="13" fill="#25211D" text-anchor="start">颠隮奈何</text><text x="286" y="225" font-size="13" fill="#25211D" text-anchor="start">望尔指告</text><text x="286" y="250" font-size="13" fill="#25211D" text-anchor="start">若之何其</text>
<rect x="508" y="92" width="218" height="209" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="508" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="522" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">父师之断</text>
<text x="524" y="150" font-size="13" fill="#25211D" text-anchor="start">我兴受其败</text><text x="524" y="175" font-size="13" fill="#25211D" text-anchor="start">我罔为臣仆</text><text x="524" y="200" font-size="13" fill="#25211D" text-anchor="start">诏王子出</text><text x="524" y="225" font-size="13" fill="#25211D" text-anchor="start">自靖各安</text><text x="524" y="250" font-size="13" fill="#25211D" text-anchor="start">人自献于先王</text>
<text x="32" y="331" font-size="12" fill="#7C6D5C" text-anchor="start">若涉大水，其无津涯</text>
</svg>
