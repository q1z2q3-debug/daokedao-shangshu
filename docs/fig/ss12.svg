<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" role="img">
<title>汤诰三层</title>
<desc>告天下的三件事</desc>
<rect x="0" y="0" width="760" height="332" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">汤诰三层</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<rect x="32" y="92" width="218" height="184" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="32" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="46" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">天道</text>
<text x="48" y="150" font-size="13" fill="#25211D" text-anchor="start">福</text><text x="48" y="175" font-size="13" fill="#25211D" text-anchor="start">善</text><text x="48" y="200" font-size="13" fill="#25211D" text-anchor="start">祸</text><text x="48" y="225" font-size="13" fill="#25211D" text-anchor="start">淫</text>
<rect x="270" y="92" width="218" height="184" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="270" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="284" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">王罪</text>
<text x="286" y="150" font-size="13" fill="#25211D" text-anchor="start">在</text><text x="286" y="175" font-size="13" fill="#25211D" text-anchor="start">予</text><text x="286" y="200" font-size="13" fill="#25211D" text-anchor="start">一</text><text x="286" y="225" font-size="13" fill="#25211D" text-anchor="start">人</text>
<rect x="508" y="92" width="218" height="184" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="508" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="522" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">民典</text>
<text x="524" y="150" font-size="13" fill="#25211D" text-anchor="start">各</text><text x="524" y="175" font-size="13" fill="#25211D" text-anchor="start">守</text><text x="524" y="200" font-size="13" fill="#25211D" text-anchor="start">尔</text><text x="524" y="225" font-size="13" fill="#25211D" text-anchor="start">典</text>
<text x="32" y="306" font-size="12" fill="#7C6D5C" text-anchor="start">看图看三层：天、王、民各有其责</text>
</svg>
