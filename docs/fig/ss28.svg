<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 357" role="img">
<title>三处：自解、天听、同心</title>
<desc>自解一立，行为就有了通行证；天听一落，通行证就作废。</desc>
<rect x="0" y="0" width="760" height="357" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">三处：自解、天听、同心</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<rect x="32" y="92" width="218" height="209" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="32" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="46" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">受之四谓</text>
<text x="48" y="150" font-size="13" fill="#25211D" text-anchor="start">谓己有天命</text><text x="48" y="175" font-size="13" fill="#25211D" text-anchor="start">谓敬不足行</text><text x="48" y="200" font-size="13" fill="#25211D" text-anchor="start">谓祭无益</text><text x="48" y="225" font-size="13" fill="#25211D" text-anchor="start">谓暴无伤</text><text x="48" y="250" font-size="13" fill="#25211D" text-anchor="start">秽德彰闻</text>
<rect x="270" y="92" width="218" height="209" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="270" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="284" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">天之听视</text>
<text x="286" y="150" font-size="13" fill="#25211D" text-anchor="start">自我民视</text><text x="286" y="175" font-size="13" fill="#25211D" text-anchor="start">自我民听</text><text x="286" y="200" font-size="13" fill="#25211D" text-anchor="start">百姓有过在予一人</text><text x="286" y="225" font-size="13" fill="#25211D" text-anchor="start">天其以予乂民</text>
<rect x="508" y="92" width="218" height="209" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="508" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="522" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">周之凭据</text>
<text x="524" y="150" font-size="13" fill="#25211D" text-anchor="start">乱臣十人</text><text x="524" y="175" font-size="13" fill="#25211D" text-anchor="start">同心同德</text><text x="524" y="200" font-size="13" fill="#25211D" text-anchor="start">虽有周亲不如仁人</text><text x="524" y="225" font-size="13" fill="#25211D" text-anchor="start">戎商必克</text>
<text x="32" y="331" font-size="12" fill="#7C6D5C" text-anchor="start">弗吊天降丧　·　吉人惟日不足</text>
</svg>
