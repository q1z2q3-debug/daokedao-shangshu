<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" role="img">
<title>三风十愆</title>
<desc>最早的官箴，不是道德清单</desc>
<rect x="0" y="0" width="760" height="332" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">三风十愆</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<rect x="32" y="92" width="218" height="184" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="32" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="46" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">巫风</text>
<text x="48" y="150" font-size="13" fill="#25211D" text-anchor="start">恒</text><text x="48" y="175" font-size="13" fill="#25211D" text-anchor="start">舞</text><text x="48" y="200" font-size="13" fill="#25211D" text-anchor="start">酣</text><text x="48" y="225" font-size="13" fill="#25211D" text-anchor="start">歌</text>
<rect x="270" y="92" width="218" height="184" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="270" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="284" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">淫风</text>
<text x="286" y="150" font-size="13" fill="#25211D" text-anchor="start">货</text><text x="286" y="175" font-size="13" fill="#25211D" text-anchor="start">色</text><text x="286" y="200" font-size="13" fill="#25211D" text-anchor="start">游</text><text x="286" y="225" font-size="13" fill="#25211D" text-anchor="start">畋</text>
<rect x="508" y="92" width="218" height="184" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="508" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="522" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">乱风</text>
<text x="524" y="150" font-size="13" fill="#25211D" text-anchor="start">侮</text><text x="524" y="175" font-size="13" fill="#25211D" text-anchor="start">圣</text><text x="524" y="200" font-size="13" fill="#25211D" text-anchor="start">比</text><text x="524" y="225" font-size="13" fill="#25211D" text-anchor="start">顽</text>
<text x="32" y="306" font-size="12" fill="#7C6D5C" text-anchor="start">看图看三列：所警在有位之臣</text>
</svg>
