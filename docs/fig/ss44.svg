<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 357" role="img">
<title>两侧之辅，一端之要</title>
<desc>两侧是史证，一端是当下；史证列得越长，当下的请求越重。</desc>
<rect x="0" y="0" width="760" height="357" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">两侧之辅，一端之要</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<rect x="32" y="92" width="218" height="209" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="32" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="46" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">殷之辅</text>
<text x="48" y="150" font-size="13" fill="#25211D" text-anchor="start">成汤：伊尹</text><text x="48" y="175" font-size="13" fill="#25211D" text-anchor="start">太甲：保衡</text><text x="48" y="200" font-size="13" fill="#25211D" text-anchor="start">太戊：伊陟臣扈巫咸</text><text x="48" y="225" font-size="13" fill="#25211D" text-anchor="start">祖乙：巫贤</text><text x="48" y="250" font-size="13" fill="#25211D" text-anchor="start">武丁：甘盘</text>
<rect x="270" y="92" width="218" height="209" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="270" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="284" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">周之辅</text>
<text x="286" y="150" font-size="13" fill="#25211D" text-anchor="start">虢叔</text><text x="286" y="175" font-size="13" fill="#25211D" text-anchor="start">闳夭</text><text x="286" y="200" font-size="13" fill="#25211D" text-anchor="start">散宜生</text><text x="286" y="225" font-size="13" fill="#25211D" text-anchor="start">泰颠</text><text x="286" y="250" font-size="13" fill="#25211D" text-anchor="start">南宫括</text>
<rect x="508" y="92" width="218" height="209" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<rect x="508" y="92" width="218" height="30" fill="#DCD5C8"/>
<text x="522" y="113" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">其要</text>
<text x="524" y="150" font-size="13" fill="#25211D" text-anchor="start">若游大川，共济</text><text x="524" y="175" font-size="13" fill="#25211D" text-anchor="start">襄我二人</text><text x="524" y="200" font-size="13" fill="#25211D" text-anchor="start">罔不能厥初，惟其终</text>
<text x="32" y="331" font-size="12" fill="#7C6D5C" text-anchor="start">一人有事于四方，若卜筮罔不是孚</text>
</svg>
