<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 564" role="img">
<title>洪范九畴矩阵</title>
<desc>九畴自五行至五福六极，皇极居中为治道中枢</desc>
<rect x="0" y="0" width="760" height="564" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">洪范九畴矩阵</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<text x="228" y="84" font-size="12.5" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" text-anchor="middle">畴目</text>
<line x1="128" y1="96" x2="128" y2="510" stroke="#DCD5C8"/>
<text x="428" y="84" font-size="12.5" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" text-anchor="middle">纲用</text>
<line x1="328" y1="96" x2="328" y2="510" stroke="#DCD5C8"/>
<text x="628" y="84" font-size="12.5" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" text-anchor="middle">要旨</text>
<line x1="528" y1="96" x2="528" y2="510" stroke="#DCD5C8"/>
<line x1="32" y1="96" x2="728" y2="96" stroke="#DCD5C8"/>
<line x1="32" y1="142" x2="728" y2="142" stroke="#DCD5C8"/>
<text x="38" y="123" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">五行</text>
<text x="228" y="123" font-size="12" fill="#25211D" text-anchor="middle">润下炎上曲直从革稼穑</text>
<text x="428" y="123" font-size="12" fill="#25211D" text-anchor="middle">辨物性</text>
<line x1="32" y1="188" x2="728" y2="188" stroke="#DCD5C8"/>
<text x="38" y="169" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">五事</text>
<text x="228" y="169" font-size="12" fill="#25211D" text-anchor="middle">恭从明聪睿</text>
<text x="428" y="169" font-size="12" fill="#25211D" text-anchor="middle">治己身</text>
<line x1="32" y1="234" x2="728" y2="234" stroke="#DCD5C8"/>
<text x="38" y="215" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">八政</text>
<text x="228" y="215" font-size="12" fill="#25211D" text-anchor="middle">食货祀司空司徒司寇宾师</text>
<text x="428" y="215" font-size="12" fill="#25211D" text-anchor="middle">理民事</text>
<line x1="32" y1="280" x2="728" y2="280" stroke="#DCD5C8"/>
<text x="38" y="261" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">五纪</text>
<text x="228" y="261" font-size="12" fill="#25211D" text-anchor="middle">岁日月星辰历数</text>
<text x="428" y="261" font-size="12" fill="#25211D" text-anchor="middle">明天度</text>
<line x1="32" y1="326" x2="728" y2="326" stroke="#DCD5C8"/>
<text x="38" y="307" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">皇极</text>
<text x="228" y="307" font-size="12" fill="#25211D" text-anchor="middle">无偏无党，王道正直</text>
<text x="428" y="307" font-size="12" fill="#25211D" text-anchor="middle">立标准</text>
<line x1="32" y1="372" x2="728" y2="372" stroke="#DCD5C8"/>
<text x="38" y="353" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">三德</text>
<text x="228" y="353" font-size="12" fill="#25211D" text-anchor="middle">正直刚克柔克</text>
<text x="428" y="353" font-size="12" fill="#25211D" text-anchor="middle">施权变</text>
<line x1="32" y1="418" x2="728" y2="418" stroke="#DCD5C8"/>
<text x="38" y="399" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">稽疑</text>
<text x="228" y="399" font-size="12" fill="#25211D" text-anchor="middle">谋心谋卿士谋庶人谋卜筮</text>
<text x="428" y="399" font-size="12" fill="#25211D" text-anchor="middle">决大疑</text>
<line x1="32" y1="464" x2="728" y2="464" stroke="#DCD5C8"/>
<text x="38" y="445" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">庶征</text>
<text x="228" y="445" font-size="12" fill="#25211D" text-anchor="middle">雨旸燠寒风</text>
<text x="428" y="445" font-size="12" fill="#25211D" text-anchor="middle">验休咎</text>
<line x1="32" y1="510" x2="728" y2="510" stroke="#DCD5C8"/>
<text x="38" y="491" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="1">五福六极</text>
<text x="228" y="491" font-size="12" fill="#25211D" text-anchor="middle">寿富康宁好德考终命</text>
<text x="428" y="491" font-size="12" fill="#25211D" text-anchor="middle">示报应</text>
<text x="32" y="538" font-size="12" fill="#7C6D5C" text-anchor="start">看图看纵向次序：由物性而身、而事、而度、而权断验报</text>
</svg>
