<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 394" role="img">
<title>放桐之层</title>
<desc>谏而不听，放诸桐宫</desc>
<rect x="0" y="0" width="760" height="394" fill="#FCFAF6"/>
<text x="32" y="44" font-size="17" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">放桐之层</text><line x1="32" y1="56" x2="728" y2="56" stroke="#DCD5C8" stroke-width="1"/>
<rect x="32" y="92" width="696" height="74" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="50" y="124" font-size="15" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">先王之命</text>
<text x="50" y="148" font-size="12" fill="#25211D" text-anchor="start">顾諟明命</text>
<rect x="42" y="178" width="676" height="74" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="60" y="210" font-size="15" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">伊尹之谏</text>
<text x="60" y="234" font-size="12" fill="#25211D" text-anchor="start">昧爽坐待</text>
<rect x="52" y="264" width="656" height="74" rx="2" fill="#F7F4EE" stroke="#DCD5C8"/>
<text x="70" y="296" font-size="15" fill="#994433" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif" letter-spacing="2">放桐居忧</text>
<text x="70" y="320" font-size="12" fill="#25211D" text-anchor="start">密迩先王训</text>
<text x="32" y="368" font-size="12" fill="#7C6D5C" text-anchor="start">看图看自上而下：劝、谏、放</text>
</svg>
